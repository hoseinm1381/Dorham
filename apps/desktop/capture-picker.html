<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose what to share</title><link rel="stylesheet" href="capture-picker.css"></head><body><main><header><div><p class="eyebrow">DORHAM</p><h1 id="title">Choose what to share</h1></div><button id="refresh" type="button">Refresh</button></header><div class="toolbar"><div role="tablist"><button role="tab" id="windows" aria-selected="true">Applications</button><button role="tab" id="screens" aria-selected="false">Screens</button></div><input id="search" type="search" aria-label="Search sources" placeholder="Search sources"></div><div id="sources" role="listbox" aria-label="Available sources"></div><p id="status" role="status"></p><footer><div id="audio"><label id="audio-label" for="scope">Share sound</label><select id="scope"><option value="none">No sound</option><option value="application">Selected application only</option><option value="system">Computer sound, excluding Dorham</option></select><p id="scope-description"></p></div><div class="actions"><button id="cancel" type="button">Cancel</button><button id="share" type="button" disabled>Share</button></div></footer></main><script src="capture-picker.js"></script></body></html>

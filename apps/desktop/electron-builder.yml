appId: com.dorham.chat
productName: Dorham
directories:
  app: apps/desktop
  output: artifacts/windows
files:
  - main.cjs
  - preload.cjs
  - updater.cjs
  - release-contract.cjs
  - voice-hotkeys.cjs
  - voice-keys.json
  - native/VoiceHotkey.exe
  - dist/**/*
  - icon.ico
  - icon.png
  - '!node_modules/**/*'
npmRebuild: false
asarUnpack:
  - native/VoiceHotkey.exe
toolsets:
  nsis: 1.2.1
win:
  target: nsis
  icon: apps/desktop/icon.ico
artifactName: Dorham-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

[package]
name = "dorham-desktop"
version = "1.5.4"
edition = "2024"
publish = false

[[bin]]
name = "Dorham"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
webview2-com = "0.39"
windows-version = "0.1"
windows = { version = "0.62", features = [
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography",
  "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_UI_Shell",
] }
windows-core = "0.62"

[profile.release]
lto = "thin"
strip = true
